{{define "configUploadContent"}}
<h1>📤 Carica impostazioni</h1>
<div class="card-modern">
    <div class="card-header">Nuova configurazione</div>
    <div class="card-body">
        {{if .Message}}
            {{if .IsError}}
                <div class="message-error">❌ {{.Message}}</div>
            {{else}}
                <div class="message-success">✅ {{.Message}}</div>
            {{end}}
        {{end}}
        <form id="uploadForm" method="POST" enctype="multipart/form-data">
            {{ .CSRFField }}
            <label for="configfile" class="form-label">File archivio (.zip, .tar, .tar.gz) contenente la configurazione</label>
            <input type="file" name="configfile" id="configfile" required accept=".zip,.tar,.tar.gz,.tgz">
            <br>
            <!-- NUOVO CHECKBOX -->
            <label for="partial" style="display: block; margin: 10px 0;">
                <input type="checkbox" name="partial" id="partial">
                Caricamento parziale (salta il controllo di completezza, ma verifica le estensioni valide)
            </label>
            <br>
            <button type="submit">Carica</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        const fileInput = document.getElementById('configfile');
        const fileName = fileInput.files[0] ? fileInput.files[0].name : '';
        const partialChecked = document.getElementById('partial').checked;
        let confirmMsg = '⚠️ ATTENZIONE: questa operazione sovrascriverà la configurazione attualmente in uso.\n\n' +
                         'Prima di procedere verrà creato automaticamente un backup.\n\n' +
                         'Sei sicuro di voler caricare "' + fileName + '" e sostituire la configurazione di produzione?';
        if (partialChecked) {
            confirmMsg += '\n\n⚡ Modalità parziale attiva: verranno accettati solo i file con estensioni valide, senza richiedere la presenza di tutti i tipi.';
        }
        if (!confirm(confirmMsg)) {
            e.preventDefault();
        }
    });
</script>
{{end}}
